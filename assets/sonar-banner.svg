<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc"><title id="title">Sonar — know your website, see what comes next</title><desc id="desc">A cyan and blue signal connects a website audit to evidence, a useful fix and a recheck. No measured results are shown.</desc><defs><linearGradient id="pulse" x1="0" x2="1"><stop stop-color="#00f2fe"/><stop offset=".6" stop-color="#0a84ff"/><stop offset="1" stop-color="#5e5ce6"/></linearGradient></defs><rect width="1280" height="380" rx="24" fill="#0c0e17"/><g fill="none"><circle cx="1090" cy="170" r="210" stroke="#18253e" stroke-width="2"/><path d="M1185 75a134 134 0 1 0 0 190" stroke="url(#pulse)" stroke-width="20" stroke-linecap="round"/><path d="M1144 116a76 76 0 1 0 0 108" stroke="url(#pulse)" stroke-width="20" stroke-linecap="round"/></g><circle cx="1090" cy="170" r="13" fill="#00f2fe"/><text x="60" y="62" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7fc9ff">SONAR BY PACTUNO</text><text x="60" y="134" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Know your website.</text><text x="60" y="190" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#a9c8ef">See what comes next.</text><text x="60" y="237" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#adbad0">Free website audits. Inspect the evidence. Verify the change.</text><path d="M74 302H730" stroke="url(#pulse)" stroke-width="3"/><g fill="#0c0e17" stroke="#0a84ff" stroke-width="3"><circle cx="74" cy="302" r="7"/><circle cx="292" cy="302" r="7"/><circle cx="511" cy="302" r="7"/><circle cx="730" cy="302" r="7"/></g><g font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#b8c7dc"><text x="60" y="339">AUDIT</text><text x="268" y="339">EVIDENCE</text><text x="500" y="339">FIX</text><text x="697" y="339">RECHECK</text></g></svg>